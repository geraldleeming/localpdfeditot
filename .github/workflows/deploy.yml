name: Deploy to GitHub Pages

on:
  push:
    # `main` is listed for when it exists; the feature branch is currently the
    # repository's default. Actions has no symbolic reference for "the default
    # branch" in a push trigger, so both are named explicitly.
    branches:
      - main
      - claude/local-pdf-editor-brainstorm-27yc6r
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Typechecks as well as bundles, so a type error fails the deploy rather
      # than shipping.
      - run: npm run build

      # Note: `enablement: true` looks like it would remove the one-time manual
      # setup step, but the default GITHUB_TOKEN cannot create a Pages site
      # ("Resource not accessible by integration"). Pages has to be switched on
      # once under Settings -> Pages, with GitHub Actions as the source.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
