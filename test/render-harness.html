<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Appearance stream render check</title>
    <style>
      body { margin: 0; background: #888; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      // Renders a PDF with annotations ENABLED, which is the opposite of what
      // the app does. That is the point: the app draws its own overlay, so only
      // an independent render proves the /AP appearance streams we wrote are
      // valid and land where they should.
      import * as pdfjs from 'pdfjs-dist/legacy/build/pdf.mjs';
      import workerUrl from 'pdfjs-dist/legacy/build/pdf.worker.min.mjs?url';

      pdfjs.GlobalWorkerOptions.workerSrc = workerUrl;

      window.renderPdf = async (bytes, pageNumber = 1) => {
        const doc = await pdfjs.getDocument({ data: new Uint8Array(bytes) }).promise;
        const page = await doc.getPage(pageNumber);
        const viewport = page.getViewport({ scale: 1.3 });
        const canvas = document.getElementById('c');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({
          canvasContext: canvas.getContext('2d'),
          canvas,
          viewport,
          annotationMode: pdfjs.AnnotationMode.ENABLE,
          background: '#ffffff',
        }).promise;
        return { width: canvas.width, height: canvas.height, scale: viewport.scale };
      };

      window.harnessReady = true;
    </script>
  </body>
</html>
